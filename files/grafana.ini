[server]
# Served behind the fleet's haproxy under the /dashboards/ prefix.
#
# DO NOT add "serve_from_sub_path = true" here. haproxy strips the prefix
# before forwarding (see movai-service haproxy.conf.j2:
# "http-request replace-path ^/dashboards/(.*) /\1"), so Grafana must keep
# serving at / while only *generating* browser-facing URLs with the prefix.
# Enabling serve_from_sub_path would make Grafana expect /dashboards/... on
# the wire and break every request behind the proxy.
#
# root_url is deliberately a root-relative path rather than a full URL:
# Grafana then builds redirects from the incoming Host header, so the same
# image works for any robot hostname. Hardcoding a domain would emit absolute
# redirects to the wrong host.
#
# Local testing without haproxy works as-is: Grafana serves both / and
# /dashboards/, and static assets resolve under either. Set
# GF_SERVER_ROOT_URL=http://localhost:3000/ only if you want unprefixed URLs.
root_url = /dashboards/

[security]
disable_login_form = true
admin_user = admin

[users]
allow_sign_up = false

[auth.anonymous]
# Anonymous read-only access. The section name matters: these settings live
# under [auth.anonymous] as "enabled" / "org_role", NOT under [auth] as
# "anonymous_enabled" / "anonymous_org_role". Grafana silently ignores unknown
# ini keys, so the previous [auth] spelling left anonymous access disabled -
# and combined with security.disable_login_form above, that served a login
# page with no login form, locking users out entirely.
enabled = true
org_role = Viewer
